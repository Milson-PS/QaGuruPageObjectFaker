plugins {
    id 'java-library'
    id 'io.qameta.allure' version '2.11.2'
}

repositories {
    mavenCentral()
}

def allureVersion = "2.21.0"
def selenideVersion = "6.19.1"

allure {
    report {
        version.set(allureVersion)
    }
    adapter {
        aspectjWeaver.set(true)
        frameworks {
            junit5 {
                adapterVersion.set(allureVersion)
            }
        }
    }
}

dependencies {
    testImplementation("com.codeborne:selenide:$selenideVersion")
    testImplementation("io.qameta.allure:allure-selenide:$allureVersion")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.0")
    testImplementation("org.slf4j:slf4j-simple:2.0.7")
    testImplementation("com.github.javafaker:javafaker:1.0.2")
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        events "started", "passed", "skipped", "failed", "standard_error", "standard_out"
        exceptionFormat "full" // Измените на 'full' для более детального вывода ошибок
        showStandardStreams = true // Показывать стандартные потоки вывода
    }
}

task regress_test(type: Test) {
    useJUnitPlatform {
        includeTags("regress")
    }
    description = 'Запуск регрессионных тестов'
}

task demoqa_test(type: Test) {
    useJUnitPlatform {
        includeTags("demoqa")
    }
    description = 'Запуск тестов DemoQA'
}